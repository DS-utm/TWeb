<h1> Bazalt </h1>
Bazaltul ia naștere prin erupția unui vulcan din lava fluidă (cu viscozitate redusă) și un conținut sărac în acid silicic și care ajuns la suprafața pământului se răcește relativ repede. <br>Magma din care ia naștere bazaltul spre deosebire de granit este o magmă bazică.
